name: Framework tests

on:
  push:
    branches: [main, initial-v0, v1]
  pull_request:

jobs:
  windows-host:
    name: Windows host / protocol
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: python -m pip install -r host/requirements.txt
      - name: Compile all host Python
        run: python -m compileall -q host tests
      - name: Protocol unit tests and native window capture
        env:
          HANDOFF_NATIVE_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Import host runtime
        run: python -c "import host.shared.dev_host as h; assert callable(h.handle); assert callable(h.main); print('Windows host runtime imports OK')"

  linux-host:
    name: Linux X11 host / native capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxcomposite1 python3-tk
      - run: python -m pip install -r host/requirements.txt
      - name: Protocol and real XComposite capture tests
        env:
          HANDOFF_NATIVE_TESTS: "1"
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a python -m unittest discover -s tests -v

  windows-package:
    name: Windows executable
    needs: windows-host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r host/requirements.txt pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name HandOff --paths . host/launcher.py
      - name: Launch and close packaged executable
        run: python tools/smoke_windows.py dist/HandOff/HandOff.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-preview
          path: artifacts/windows-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: HandOff-Windows
          path: dist/HandOff/
          if-no-files-found: error

  android-client:
    name: Android client build / test / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run Android JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: handoff-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TLS fixture dependencies
        working-directory: .
        run: python -m pip install -r host/requirements.txt
      - name: Build device test APK before pairing
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android real TLS, decode, return and reconnect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            python -m tests.emulator_host /tmp/handoff-pairing.txt > /tmp/handoff-fixture.log 2>&1 &
            for attempt in $(seq 1 30); do test -f /tmp/handoff-pairing.txt && break; sleep 1; done
            test -f /tmp/handoff-pairing.txt
            adb push /tmp/handoff-pairing.txt /data/local/tmp/handoff-pairing.txt
            cd android && gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Upload Android device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: android/app/build/reports/androidTests/
