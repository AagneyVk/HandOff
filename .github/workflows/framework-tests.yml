name: Framework tests

on:
  push:
    branches: [main, initial-v0, v1]
  pull_request:

jobs:
  windows-host:
    name: Windows host / protocol
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all host Python
        run: python -m compileall -q host tests
      - name: Protocol unit tests
        run: python -m unittest discover -s tests -v
      - name: Import host runtime
        run: python -c "import host.shared.dev_host as h; assert callable(h.handle); assert callable(h.main); print('Windows host runtime imports OK')"

  android-client:
    name: Android client build / test / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and run Android JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: handoff-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
